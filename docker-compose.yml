services:
  nginx:
    restart: unless-stopped
    image: nginx:alpine
    ports:
      - "3010:3010"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./build:/usr/share/nginx/html:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - drenlia-network

  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - APP_MODE=production
      - PORT=3010
      - CHOKIDAR_USEPOLLING=false
      - FAST_REFRESH=false
      - WATCHPACK_POLLING=false
      - DISABLE_ESLINT_PLUGIN=true
      - GENERATE_SOURCEMAP=false
    volumes:
      - .:/app:delegated
      - /app/node_modules
      - /app/server/node_modules
      - /app/setup/node_modules
      - /app/setup/api/node_modules
      - ./server:/app/server
    command: ["sh", "/app/scripts/docker-start.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');if(!fs.existsSync('/app/build/index.html'))process.exit(1);require('http').get('http://127.0.0.1:3011/api/settings',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - drenlia-network

networks:
  drenlia-network:
    driver: bridge
